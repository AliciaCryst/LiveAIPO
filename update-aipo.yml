name: Refresh AIPO holdings map

on:
  schedule:
    - cron: '35 6 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aipo-refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download holdings and prices; generate outputs
        run: python generate_aipo.py
      - name: Commit updated output files
        run: |
          git add -- aipo.html aipo.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update AIPO holdings map'
            git push
          fi
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp aipo.html _site/index.html
          cp aipo.html _site/aipo.html
          cp aipo.txt _site/aipo.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
